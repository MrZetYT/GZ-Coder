name: Build and Test

on:
  push:
    branches: [ main, maxim/feature-base ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore RAG_Code_Base.csproj

      - name: Build
        run: dotnet build RAG_Code_Base.csproj --no-restore --configuration Release

      - name: Docker Build
        run: docker build -t rag-api:latest .